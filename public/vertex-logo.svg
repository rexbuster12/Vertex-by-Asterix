<svg viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Satin Champagne Metallic Linear Gradient -->
    <linearGradient id="champagneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5DFD7"/>
      <stop offset="25%" stop-color="#D4C8BA"/>
      <stop offset="50%" stop-color="#C3B8A8"/>
      <stop offset="75%" stop-color="#BAAF9D"/>
      <stop offset="100%" stop-color="#A59886"/>
    </linearGradient>
  </defs>

  <!-- Metallic Champagne Background -->
  <rect width="400" height="500" rx="24" fill="url(#champagneGrad)"/>

  <!-- Bold Geometric V Left Wing -->
  <path d="M108 150 L170 300 L145 365 L45 150 Z" fill="#0D0C13"/>

  <!-- Bold Geometric V Right Wing (Split) -->
