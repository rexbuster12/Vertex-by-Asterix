  <path d="M192 376 L170 425 L152 390 L176 342 Z" fill="#0D0C13"/>

  <!-- Precision Diagonal Intersection Slash Line -->
  <line x1="262" y1="70" x2="90" y2="455" stroke="#0D0C13" stroke-width="7" stroke-linecap="round"/>
</svg>
